name: Pidä Supabase hereillä

# A free Supabase project pauses after 7 days without activity (e.g. summer break), which would
# break sign-in for every user. One tiny query a day keeps it awake. Values are public
# (project URL + publishable key), stored as repository variables SUPABASE_URL / SUPABASE_KEY.
on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_URL != '' && vars.SUPABASE_KEY != '' }}
    steps:
      - name: Ping database
        run: |
          curl -fsS --max-time 30 -X POST "${{ vars.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ vars.SUPABASE_KEY }}" -H "Content-Type: application/json" -d '{}'
