name: Päivitä AI-mallidata

on:
  schedule:
    - cron: "17 4 */2 * *"   # joka toinen päivä klo 04:17 UTC
  workflow_dispatch:
    inputs:
      inspect:
        description: "Tulosta vain kenttien nimet (ei päivitä dataa)"
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time, and never cancel a run that is about to push.
concurrency:
  group: update-models
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hae rankingit
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: python3 scripts/update_models.py ${{ inputs.inspect && '--inspect' || '' }}
      - name: Committaa jos muuttui
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/ai-models.json data/media-seen.json data/ai-history.json
          git diff --cached --quiet && { echo "ei muutoksia"; exit 0; }
          git commit -m "Päivitä AI-mallien rankingit"
          # main may have moved while this ran (the tools routine and manual pushes): rebase, never force
          git pull --rebase --autostash origin main
          git push
