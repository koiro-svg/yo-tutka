<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YO-harjoittelu</title>
<meta name="description" content="Tee ylioppilaskokeiden tehtäviä Abitti-tyylisellä kaavaeditorilla. Vihjeet, malliratkaisut, itsearvio, kertauslista ja koesimulaatio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@digabi/mathquill@0.10.12/build/mathquill.css" integrity="sha384-Bjv922/rg2S1nHWkK1ojuHz92gznxN3aI6bV3IRuaoGWEr5WfgDOPMm3acaTXqN3" crossorigin="anonymous">
<style>
/* koirosvg radar theme: deliberately dark-only, same palette as index.html.
   Exception: answer fields are light "paper" like in Abitti, because formula images are black SVGs. */
:root{
  color-scheme:dark;
  --bg:#081427; --bg-glow:#0E2140; --surface:#0F213D; --surface-2:#16294A; --line:#1F3B66; --line-2:#182F52;
  --ink:#E6EEF8; --ink-2:#B4C3D8; --ink-3:#8FA3BF;
  --accent:#5CE1C6; --accent-ink:#06221C; --accent-soft:#123D45;
  --spring:#6FC48F; --autumn:#E58E4E;
  --ok:#6FC48F; --ok-soft:#173A2E; --warn:#E8B45C; --warn-soft:#3A3222; --bad:#F08A7E; --bad-soft:#3E2227;
  --paper:#FBFCFE; --paper-ink:#141B26; --paper-line:#C9D3E1;
  --focus:#5CE1C6;
  --font-display:"Unbounded","Helvetica Neue",Arial,sans-serif;
  --font-body:"Atkinson Hyperlegible","Helvetica Neue",Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(ellipse 900px 520px at 75% 0%,var(--bg-glow),transparent 70%) no-repeat,var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;padding-inline:clamp(16px,3vw,40px);padding-block:20px 80px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4.5vw,44px);font-weight:800;letter-spacing:-.02em}
h2{font-size:21px;font-weight:700;overflow-wrap:anywhere}
h3{font-size:16px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
/* a select is as wide as its longest option; width:100% inside a capped label lets it shrink on phones */
.row>label{max-width:100%;min-width:0}
.row>label>select{width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

.layout{max-width:1240px;margin:0 auto;display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
body.aids-open .layout{max-width:1680px}
@media (min-width:1100px){ body.aids-open .layout{grid-template-columns:minmax(0,1fr) minmax(380px,40%)} }
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-content:start;min-width:0;overflow-wrap:anywhere}   /* long chemical names / task titles must not widen the page */
.masthead,.taskhead{grid-template-columns:minmax(0,1fr)}
.wrap>*{min-width:0}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.masthead{display:grid;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.masthead .eyebrow{color:var(--accent)}
.lede{color:var(--ink-2);max-width:70ch;font-size:16px}
.crumb{display:inline-flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--font-mono);font-size:13px}
.crumb a{padding-block:8px;text-decoration:none;color:var(--ink-3)}
.crumb a:hover{color:var(--accent)}
.muted{color:var(--ink-3)}
.sp{margin-left:auto}
.small{font-size:13px}
.mono{font-family:var(--font-mono)}
.warnbox{background:var(--warn-soft);border-radius:10px;padding:12px 14px;font-size:14px}

.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:700;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.card{background:linear-gradient(180deg,rgba(92,225,198,.05),transparent 200px),var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start;min-width:0}
.grid2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.chip{display:inline-block;font-family:var(--font-mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:2px 6px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.K{background:#173A2E;color:var(--spring)} .chip.S{background:#3A2A22;color:var(--autumn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.bad{background:var(--bad-soft);color:var(--bad)}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--ink-2)}

/* home */
.list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.list a{font-weight:700;text-decoration:none}
.list a:hover{text-decoration:underline}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 90px 44px;gap:10px;align-items:center;font-size:14px}
.meter .track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter .fill{height:100%;background:var(--accent)}
.meter .fill.bad{background:var(--bad)} .meter .fill.warn{background:var(--warn)}
.meter .v{font-family:var(--font-mono);font-size:12px;text-align:right;color:var(--ink-2)}
details.sess{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.sess>summary{cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:700}
.tasks{display:grid;gap:2px;padding:0 10px 12px}
.trow{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 6px;border-radius:8px;text-decoration:none;color:inherit}
.trow:hover{background:var(--surface-2)}
.trow .n{font-family:var(--font-mono);font-weight:600;color:var(--accent)}
.trow .t{font-weight:700;overflow-wrap:anywhere}
.trow .s{grid-column:2/-1;color:var(--ink-3);font-size:13px}
.trow .st{font-family:var(--font-mono);font-size:12px;white-space:nowrap}

/* task view */
.taskhead{display:grid;gap:8px}
.taskhead .sum{color:var(--ink-2);max-width:75ch}
.unit{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:12px;scroll-margin-top:calc(var(--toolbar-h,0px) + 16px);min-width:0}
.unit .uhead{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.unit .uhead b{font-family:var(--font-display);font-size:15px}
.md{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;max-width:78ch;min-width:0;overflow-wrap:anywhere}
.md>*{min-width:0}   /* grid items default to min-width:auto, which lets a wide formula widen the page */
.md ul,.md ol{margin:0;padding-left:22px;display:grid;gap:3px}
.md mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%}
/* MathJax 3 cannot line-break: a too-wide inline formula shrinks to fit instead of widening the page */
.md mjx-container:not([display="true"]) svg{max-width:100%;height:auto}
.md mjx-assistive-mml{max-width:100%}   /* invisible screen-reader copy: must not widen the page either */
.intro{border-left:3px solid var(--accent);padding:4px 0 4px 14px;color:var(--ink-2)}
.help{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;min-width:0}
.reveal{min-width:0;border-radius:10px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line-2)}
.reveal.hint{border-left:3px solid var(--warn)}
.reveal.sol{border-left:3px solid var(--accent)}
.reveal .rh{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.assess{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.pts{display:flex;flex-wrap:wrap;gap:4px}
.pts button{min-width:36px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:5px 8px;cursor:pointer;font-family:var(--font-mono);font-size:13px}
.pts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pts input{width:5.5em;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* answer editor ("paper") */
.answer{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:8px;min-height:120px;padding:12px 14px;font-family:Arial,"Helvetica Neue",sans-serif;font-size:16px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text}
.answer:focus{outline:2px solid var(--accent);outline-offset:1px}
.answer:empty::before{content:attr(data-ph);color:#7A8699}
.answer img{max-width:100%;vertical-align:middle}
.answer img.eq{cursor:pointer;max-width:none}
.answer img.eq:hover{outline:1px dashed #5B8DEF}
.answer img.shot{display:block;margin:6px 0;border:1px solid var(--paper-line)}
.afoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--font-mono);font-size:12px;color:var(--ink-3)}
.eq-edit{display:inline-flex;flex-direction:column;gap:4px;vertical-align:middle;min-width:14em;max-width:100%;padding:6px;margin:2px;background:#EEF4FF;border:1px solid #5B8DEF;border-radius:6px;white-space:normal}
.eq-edit .mq-editable-field{min-height:1.6em;padding:3px 5px;background:#fff;border-color:#9CB4E0 !important;font-size:18px}
.eq-edit .mq-editable-field.mq-focused{box-shadow:0 0 0 2px #5B8DEF;border-color:#5B8DEF !important}
.eq-edit textarea{font-family:var(--font-mono);font-size:13px;resize:none;border:1px solid #9CB4E0;border-radius:4px;padding:3px 5px;background:#fff;color:#141B26;min-height:1.9em;overflow:hidden}

/* editor toolbar: fixed on top while an answer is focused, like in Abitti */
.rte{position:fixed;left:0;right:0;top:0;z-index:50;background:#0B1A31;border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.35);padding:6px clamp(8px,2vw,24px);display:grid;gap:6px}
.rte .bar{display:flex;gap:4px;align-items:center;overflow-x:auto;scrollbar-width:thin}
.rte button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;min-width:32px;height:32px;padding:0 8px;cursor:pointer;font-size:15px;color:var(--ink)}
.rte button:hover{border-color:var(--accent)}
.rte button.wide{font-weight:700;font-size:13px}
.rte button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.rte .sep{flex:none;width:1px;height:24px;background:var(--line);margin:0 4px}
.rte .mathbar{display:none}
.rte.math .mathbar{display:flex}
.rte .keys{font-size:12px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 14px;padding:4px 2px}
.rte .keys kbd{font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}

/* exam simulation */
.simbar{position:sticky;top:calc(var(--toolbar-h,0px));z-index:20;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:10px 14px}
body.tools-on .simbar{top:calc(var(--toolbar-h,0px) + 4px)}
.clock{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--accent)}
.clock.low{color:var(--warn)}
.section{display:grid;gap:10px}
.section>header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
details.simtask{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.simtask[data-chosen="1"]{border-color:var(--accent)}
details.simtask>summary{cursor:pointer;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.simbody{display:grid;gap:12px;padding:0 14px 14px}
.total{font-family:var(--font-display);font-size:28px}

/* quick test + progress view */
.pikabar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px}
.hero{font-family:var(--font-display);font-size:34px;line-height:1}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible;touch-action:pan-y}
.chart .g{stroke:var(--line-2);stroke-width:1}
.chart .ax{fill:var(--ink-3);font:11px var(--font-mono)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .lbl{fill:var(--ink);font:600 12px var(--font-mono)}
.chart .xh{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.chart .tip{position:absolute;top:-8px;max-width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;pointer-events:none}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th,.ptable td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
.ptable th{font-family:var(--font-mono);font-size:11px;color:var(--ink-3);font-weight:600}

/* aids panel */
.aids{position:sticky;top:calc(var(--toolbar-h,0px) + 12px);height:calc(100vh - var(--toolbar-h,0px) - 24px);display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.aids .tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.aids .tabs button{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;cursor:pointer;font-size:13px;font-weight:700}
.aids .tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.aids .tabs .x{margin-left:auto}
.aids .pane{min-height:0;border-radius:8px;overflow:hidden;background:#fff}
.aids .pane.links{background:var(--surface-2);overflow:auto;padding:14px;display:grid;gap:10px;align-content:start}
.aids iframe{width:100%;height:100%;border:0;display:block}
.aids .aidlazy{height:100%;display:grid;place-items:center;background:var(--surface-2)}
@media (max-width:1099px){
  .aids{position:fixed;left:8px;right:8px;bottom:8px;top:auto;height:68vh;z-index:40;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
}
.fab{position:fixed;right:16px;bottom:16px;z-index:30;box-shadow:0 6px 18px rgba(0,0,0,.4)}
body.aids-open .fab{display:none}
footer{color:var(--ink-3);font-size:13px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}
@media print{ .rte,.fab,.aids,.help,.assess,.simbar .btn{display:none!important} body{background:#fff;color:#000} }
</style>
</head>
<body>
<div class="layout">
  <main class="wrap" id="app"><p class="muted">Ladataan…</p></main>
  <aside class="aids" id="aids" hidden aria-label="Apuvälineet">
    <div class="tabs" role="toolbar" aria-label="Apuväline">
      <button type="button" data-aid="mafy" aria-pressed="true">Mafy-taulukot</button>
      <button type="button" data-aid="geogebra">GeoGebra</button>
      <button type="button" data-aid="cas">CAS</button>
      <button type="button" data-aid="desmos">Desmos</button>
      <button type="button" data-aid="links">Muut</button>
      <button type="button" class="btn ghost x" id="aidsClose" aria-label="Sulje apuvälineet">✕</button>
    </div>
    <div class="pane" id="aidPane"></div>
  </aside>
</div>
<button type="button" class="btn primary fab" id="aidsOpen">🧮 Apuvälineet</button>

<div class="rte" id="rte" hidden role="toolbar" aria-label="Vastauksen työkalut">
  <div class="bar" id="rteChars"></div>
  <div class="bar mathbar" id="rteMath"></div>
  <div class="keys" id="rteKeys" hidden>
    <span><kbd>Ctrl</kbd>+<kbd>E</kbd> kirjoita kaava</span><span><kbd>Esc</kbd> sulje kaava</span><span><kbd>Enter</kbd> kaava seuraavalle riville</span>
    <span><kbd>/</kbd> jakoviiva</span><span><kbd>*</kbd> kertomerkki</span><span><kbd>^</kbd> eksponentti</span><span><kbd>_</kbd> alaindeksi</span>
    <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> / <kbd>Ctrl</kbd>+<kbd>Y</kbd> kumoa / tee uudelleen</span><span><kbd>Ctrl</kbd>+<kbd>V</kbd> liitä kuva leikepöydältä</span>
    <span>Klikkaa kaavaa muokataksesi sitä</span>
  </div>
</div>
<input type="file" id="imgPick" accept="image/*" hidden>
<input type="file" id="filePick" accept=".html,text/html" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha384-1H217gwSVyLSIfaLxHbE7dRb3v4mYCKbpQvzx0cegeju1MVsGrX5xXxAvs/HgeFs" crossorigin="anonymous" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@digabi/mathquill@0.10.12/build/mathquill.min.js" integrity="sha384-BzrSE7Jl9d3yBARQ8iMAdRmtdJEyZbgvZVL4q/EcwEQIrGJsBiIjz/3xd7hmg8S2" crossorigin="anonymous" defer></script>
<script>
(function(){
  'use strict';
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sessKey = id => { const m = /^(\d{4})([KS])$/.exec(id); return m ? (+m[1]) * 2 + (m[2] === 'K' ? 0 : 1) : 0; };
  const shortLabel = id => { const m = /^(\d{4})([KS])$/.exec(id); return m ? m[2] + m[1].slice(2) : id; };
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
  const addDays = n => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + n); return d.getTime(); };   // local midnight, DST-safe
  const today = () => addDays(0);
  const fmtDate = t => { const d = new Date(t); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; };
  const TUTKA = '/yo-tutka';
  const MATHJAX_URL = 'https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js';

  // Keys shared with yo-tutka.html: unit score key "aine|kerta|n|yksikkö" ('_' = whole task).
  const ukey = (a, k, n, u) => [a, k, n, u || '_'].join('|');
  const parseKey = key => { const [a, k, n, u] = key.split('|'); return { a, k, n, u: u === '_' ? '' : u }; };
  const taskHref = (a, k, n, u) => '#/' + ['t', a, k, n, u].filter(Boolean).map(encodeURIComponent).join('/');
  const simKey = (a, k, g) => [a, k, g].filter(Boolean).join('|');

  /* ---------- persistent state (small data in localStorage, answers in IndexedDB) ---------- */
  // localStorage 'yo-practice' is also read by yo-tutka.html (scores → weak topics). Keep the key format.
  const LS = 'yo-practice';
  const S = { v: 1, scores: {}, review: {}, sims: {}, history: null, ui: {} };
  try { Object.assign(S, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
  // every self-assessment ever made (progress view); older saves are seeded from their latest scores
  if (!Array.isArray(S.history)) S.history = Object.entries(S.scores).map(([k, v]) => ({ k, p: v.p, max: v.max, at: v.at })).sort((x, y) => x.at - y.at);
  const persist = () => { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} };
  // another tab saved: take its state, so our next persist() does not overwrite it

  function md(src) {

  // Only plain text, line breaks, formula images and pasted/attached images are kept (an open .eq-edit box is skipped).
  const SAFE_IMG = /^data:image\/(png|jpeg|gif|webp|svg\+xml)[;,]/i;
  function clean(src, dst = document.createElement('div')) {
    for (const n of src.childNodes) {
      if (n.nodeType === 3) { dst.append(n.textContent); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName.toUpperCase();
      if (tag === 'BR') dst.append(document.createElement('br'));
      else if (tag === 'IMG') {
        const src = n.getAttribute('src') || '', isEq = n.classList.contains('eq');
        const latex = n.getAttribute('data-latex') || '';
        if (!(isEq && latex) && !SAFE_IMG.test(src)) continue;
        const img = document.createElement('img');
        if (isEq) {
          img.className = 'eq'; img.alt = latex; img.dataset.latex = latex;
          if (/^data:image\/svg\+xml[;,]/i.test(src)) img.src = src;
          const va = n.style.verticalAlign; if (/^-?[\d.]+ex$/.test(va)) img.style.verticalAlign = va;
        } else { img.className = 'shot'; img.alt = 'liitetty kuva'; img.src = src; }
        dst.append(img);
      }
      else if (/^(SCRIPT|STYLE|TEMPLATE|IFRAME|OBJECT|EMBED|SVG|MATH|HEAD|TITLE)$/.test(tag) || n.classList.contains('eq-edit')) continue;
      else if (/^(DIV|P|LI|TR|H[1-6]|BLOCKQUOTE|PRE|UL|OL|TABLE)$/.test(tag)) dst.append(clean(n));
      else clean(n, dst);
    }
    return dst;
  }
  const answerHtml = root => clean(root).innerHTML;
  function setAnswer(root, html) {
    const tpl = document.createElement('template'); tpl.innerHTML = html;
    root.replaceChildren(...clean(tpl.content).childNodes);

  const saveTimers = new WeakMap();
  function saveAnswer(root) {
    clearTimeout(saveTimers.get(root));

  function countChars(root) {
    const out = root.parentElement.querySelector('.count'); if (!out) return;
    const n = root.textContent.replace(/\s/g, '').length;   // whitespace is ignored, so textContent needs no layout
    const imgs = $$('img.shot', root).length, eqs = $$('img.eq', root).length;
    out.textContent = `${n} merkkiä ilman välilyöntejä` + (eqs ? ` · ${eqs} kaavaa` : '') + (imgs ? ` · ${imgs} kuvaa` : '');
  }
  function fileToDataUrl(file) {
    return new Promise((res, rej) => {
      const fr = new FileReader(); fr.onerror = () => rej(fr.error);
      fr.onload = () => {
        const url = fr.result;
        // keep small web-safe images as they are; convert everything else (HEIC, AVIF, BMP, big photos) to JPEG
        if (/^image\/(gif|svg\+xml)$/.test(file.type) || (/^image\/(png|jpeg|webp)$/.test(file.type) && file.size < 400e3)) return res(url);
        const im = new Image(); im.onerror = () => rej(new Error('Kuvamuotoa ei tueta'));
        im.onload = () => {
          const k = Math.min(1, 1600 / Math.max(im.width, im.height));
          const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
          const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.85));
        };
        im.src = url;
      };
      fr.readAsDataURL(file);
    });
  }

  // "Tallenna kuvana": draw the answer through an SVG foreignObject onto a canvas.
  async function answerPng(root, name) {
    const el = clean(root), w = Math.max(320, root.clientWidth);
    const style = `width:${w}px;box-sizing:border-box;padding:16px;background:#fff;${PAPER}`;
    const holder = document.createElement('div'); holder.className = 'png-measure'; holder.style.cssText = `position:absolute;left:-9999px;top:0;${style}`;
    holder.innerHTML = `<style>${paperImgCss('.png-measure')}</style>${el.innerHTML}`; document.body.append(holder);
    const h = holder.scrollHeight + 8; holder.remove();
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="${style}"><style>${paperImgCss('div')}</style>${new XMLSerializer().serializeToString(el)}</div></foreignObject></svg>`;
    const im = new Image();
    await new Promise((res, rej) => { im.onload = res; im.onerror = rej; im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
    const c = document.createElement('canvas'); const k = 2; c.width = w * k; c.height = h * k;
    const g = c.getContext('2d'); g.scale(k, k); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(im, 0, 0);
    try { c.toBlob(b => download(b, name + '.png'), 'image/png'); }
    catch (e) { alertBox('Selain ei salli kuvan tallennusta. Käytä tulostusta (Ctrl-P → Tallenna PDF:ksi).'); }
  }

    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();

  }

  const CHECK_TXT = { 'hvp': 'tarkistettu YTL:n hyvän vastauksen piirteitä vasten', 'laskettu': 'loppuvastaus laskettu koneellisesti', 'hvp+laskettu': 'tarkistettu hyvän vastauksen piirteitä vasten ja laskettu koneellisesti', 'malli': 'esimerkkivastaus: yhtä oikeaa vastausta ei ole, malli noudattaa YTL:n arviointikriteerejä', 'ei': 'ei tarkistettu' };
  const CHECK_CHIP = { 'ei': ['warn', 'ei tarkistettu'], 'malli': ['', 'esimerkkivastaus'] };
  const revLabel = on => on ? '✓ Kertauslistalla' : 'Kertaa myöhemmin';
  function syncRev(btn, key) { if (!btn) return; const on = !!S.review[key]; btn.setAttribute('aria-pressed', String(on)); btn.textContent = revLabel(on); }
  function unitBlock(ctx, u, { prefix = '', showHelp = true } = {}) {
    const key = ukey(ctx.a, ctx.k, ctx.n, u.id);
    const hints = u.hints || [];
    const [chkCls, chkTxt] = CHECK_CHIP[u.check] || ['ok', '✓ tarkistettu'];
    const checkChip = u.check ? `<span class="chip ${chkCls}" title="${esc(CHECK_TXT[u.check] || '')}">${chkTxt}</span>` : '';
    const hintBtn = (_, i) => `<button type="button" class="btn" data-hint="${i}" ${i > 0 ? 'disabled' : ''} aria-expanded="false">Vihje ${i + 1}${hints.length > 1 ? (i === 0 ? ' · kevyt' : ' · vahva') : ''}</button>`;
    const help = !u.solution
      ? `<p class="muted small">Tälle tehtävälle ei ole vielä vihjeitä eikä malliratkaisua. Katso <a href="${esc(ctx.gradingUrl || ctx.examUrl || '#')}" target="_blank" rel="noopener">YTL:n hyvän vastauksen piirteet</a> ja arvioi itsesi.</p>`
      : `<div class="row">${hints.map(hintBtn).join('')}
          <button type="button" class="btn" data-act="sol" aria-expanded="false">Näytä malliratkaisu</button>
          <button type="button" class="btn ghost" data-act="rev" aria-pressed="${!!S.review[key]}">${revLabel(!!S.review[key])}</button></div>
          ${hints.map((h, i) => `<div class="reveal hint md" data-hintbox="${i}" hidden><div class="rh">Vihje ${i + 1}</div>${md(h)}</div>`).join('')}
          <div class="reveal sol md" data-solbox hidden><div class="rh">Malliratkaisu</div>${md(u.solution)}${u.answer ? `<p><b>Vastaus:</b> ${md(u.answer).replace(/^<p>|<\/p>$/g, '')}</p>` : ''}${u.check ? `<p class="muted small">${esc(CHECK_TXT[u.check] || '')}</p>` : ''}</div>`;
    return `<section class="unit" id="u-${esc(u.id || '_')}" data-key="${esc(key)}">
      <div class="uhead">${u.id ? `<b>${esc(u.id)}</b>` : ''}<span class="chip">${esc(u.points)} p</span>${checkChip}${scoreChip(S.scores[key], 'data-score title="oma arvio"')}</div>
      ${u.prompt ? `<div class="md">${md(u.prompt)}</div>` : ''}
      <div class="answer" data-key="${esc(prefix + key)}" data-unit="${esc(u.id || '')}"></div>
      <div class="afoot"><span class="count"></span><span class="sp"></span><button type="button" class="btn ghost" data-act="png">Tallenna kuvana</button></div>
      ${showHelp ? `<div class="help">${help}<div class="assess" ${u.solution ? 'hidden' : ''}>${assessHtml(key, u.points)}</div></div>` : ''}
    </section>`;
  }
  function assessHtml(key, max) {
    const v = S.scores[key];
    const buttons = max <= 20
      ? `<div class="pts" role="group" aria-label="Pisteet">${Array.from({ length: max + 1 }, (_, i) => `<button type="button" data-pts="${i}" aria-pressed="${v ? v.p === i : false}">${i}</button>`).join('')}</div>`
      : `<div class="pts"><input type="number" min="0" max="${max}" step="1" value="${v ? v.p : ''}" aria-label="Pisteet 0–${max}"><button type="button" data-pts="input">Tallenna</button></div>`;
    return `<b>Arvioi pisteesi mallia vasten (0–${max} p)</b>${buttons}<span class="muted small" data-assessnote>${v ? `Viimeksi ${v.p}/${v.max} p (${fmtDate(v.at)}).` : 'Arvio päivittää oman osaamisen, heikot aiheet ja kertauslistan.'}</span>`;
  }
  // Toggle a hint/solution box; its formulas are typeset on first open only.
  function reveal(box, btn) {
    const open = box.hidden;
    box.hidden = !open; btn.setAttribute('aria-expanded', String(open));
    if (open && !box.dataset.ts) { box.dataset.ts = 1; typeset(box); }
    return open;
  }
  function bindUnit(sec, max) {
    const key = sec.dataset.key;
    const hintBtns = $$('[data-hint]', sec);
    hintBtns.forEach((b, i) => b.onclick = () => { if (reveal($(`[data-hintbox="${i}"]`, sec), b) && hintBtns[i + 1]) hintBtns[i + 1].disabled = false; });
    const sol = $('[data-act="sol"]', sec);
    if (sol) sol.onclick = () => {
      const open = reveal($('[data-solbox]', sec), sol);
      sol.textContent = open ? 'Piilota malliratkaisu' : 'Näytä malliratkaisu';
      if (open) $('.assess', sec).hidden = false;
    };
    const rev = $('[data-act="rev"]', sec);
    if (rev) rev.onclick = () => { toggleReview(key); syncRev(rev, key); };
    const assess = $('.assess', sec);
    if (assess) assess.addEventListener('click', e => {
      const b = e.target.closest('[data-pts]'); if (!b) return;
      const raw = b.dataset.pts === 'input' ? $('input', assess).value.trim() : b.dataset.pts;
      const p = Math.round(+raw);
      if (raw === '' || !(p >= 0 && p <= max)) return;
      setScore(key, p, max);
      sec.dispatchEvent(new CustomEvent('yo:score', { bubbles: true }));
      assess.innerHTML = assessHtml(key, max);
      $('[data-assessnote]', assess).textContent = `Tallennettu ${p}/${max} p.` + (S.review[key] ? ` Kohta on kertauslistalla (${fmtDate(S.review[key].due)}).` : '');
      syncRev(rev, key);
      const chip = scoreChip(S.scores[key], 'data-score title="oma arvio"'), old = $('[data-score]', sec);
      if (old) old.outerHTML = chip; else $('.uhead', sec).insertAdjacentHTML('beforeend', chip);
    });
    $('[data-act="png"]', sec).onclick = () => answerPng($('.answer', sec), 'vastaus-' + key.replace(/\|/g, '-')).catch(() => alertBox('Kuvan tallennus epäonnistui. Käytä tulostusta (Ctrl-P).'));
  }
  // Typeset the visible text, wire up the unit controls and load saved answers.
  function mountUnits(container, units) {
    typeset($$('.md:not(.reveal)', container));
    $$('.unit', container).forEach((sec, j) => { bindUnit(sec, units[j].points); mountEditor($('.answer', sec)); });
  }

  /* ---------- exam simulation ---------- */
  async function simView(a, k, g) {
    const s = subj(a), session = sessionOf(a, k);
    if (!session) { location.hash = '#/'; return; }
    let signal = setView(masthead(homeCrumb(a), 'Koesimulaatio') + '<p class="muted">Ladataan…</p>');
    const content = await getContent(a, k);
    if (signal.aborted) return;
    const ex = examFor(content, session);
    const head = `${s.name.split(',')[0]} · ${session.label}`;
    // Some subjects (äidinkieli) have two separate exams in one session: sections carry a `group`.
    const groups = Array.from(new Set(ex.sections.map(x => x.group).filter(Boolean)));
    if (groups.length > 1 && !groups.includes(g)) {
      setView(masthead(homeCrumb(a), 'Koesimulaatio', esc(head)) + `
        <section class="card"><h2>Valitse koe</h2><p class="muted">Tällä kerralla on kaksi erillistä koetta eri päivinä. Kumpikin tehdään omana simulaationaan.</p>
        <div class="row">${groups.map(x => `<a class="btn primary" href="#/koe/${encodeURIComponent(a)}/${encodeURIComponent(k)}/${encodeURIComponent(x)}">${esc(cap(x))}${simStatus(simKey(a, k, x))}</a>`).join('')}</div></section>${footer()}`);
      return;
    }
    const sections = g ? ex.sections.filter(x => x.group === g) : ex.sections;
    const minutes = sections.length ? sections[0].minutes : 360;
    const sk = simKey(a, k, g), sim = S.sims[sk];
    const title = esc(head + (g ? ' · ' + g : ''));
    if (!sim) {
      setView(masthead(homeCrumb(a), 'Koesimulaatio', title) + `
        <section class="card">
          <h2>Kokeen rakenne</h2>
          <p>Aikaa on <b>${Math.floor(minutes / 60)} h${minutes % 60 ? ' ' + minutes % 60 + ' min' : ''}</b>. Kello käy, vaikka suljet sivun. Tauon voi pitää, vaikka oikeassa kokeessa ei voi.</p>
          <ul class="list">${sections.map(x => `<li><b>${esc(x.title)}</b><span class="muted">vastaa ${x.answer}/${x.tasks.length} tehtävään${x.note ? ' · ' + esc(x.note) : ''}</span></li>`).join('')}</ul>
          <p class="muted small">Vihjeet ja malliratkaisut ovat piilossa, kunnes palautat kokeen. Sen jälkeen arvioit jokaisen valitsemasi tehtävän ja näet arvioidut kokonaispisteet. Kokeen vastaukset ovat erillään tavallisista harjoitusvastauksista.</p>
          <div class="row"><button type="button" class="btn primary" id="simStart">Aloita koe</button><a class="btn ghost" href="#/${esc(a)}">Peruuta</a></div>
        </section>${footer()}`);
      $('#simStart').onclick = () => { S.sims[sk] = { start: Date.now(), paused: 0, pauseAt: null, chosen: [], submitted: null }; persist(); simView(a, k, g); };
      return;
    }
    const remaining = () => minutes * 6e4 - ((sim.submitted || sim.pauseAt || Date.now()) - sim.start - sim.paused);
    const fmt = ms => { ms = Math.max(0, ms); const h = Math.floor(ms / 36e5), m = Math.floor(ms / 6e4) % 60, x = Math.floor(ms / 1e3) % 60; return `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}`; };
    const done = !!sim.submitted;
    const chosen = new Set(sim.chosen);
    const totals = () => {
      let total = 0, totalMax = 0, assessed = 0;
      for (const t of session.tasks) {
        if (!chosen.has(t.n)) continue;
        for (const u of unitsFor(content, t).units) { totalMax += u.points; const v = S.scores[ukey(a, k, t.n, u.id)]; if (v && v.at >= sim.start) { total += v.p; assessed++; } }
      }
      return { total, totalMax, assessed };
    };
    const tot = totals(), idx = scoreIndex();
    if (done) { sim.result = tot; persist(); }   // shown in the progress view
    const simTask = n => {
      const t = taskOf(a, k, n), on = chosen.has(n);
      if (!t || (done && !on)) return '';
      const right = done ? scoreChip(idx.get([a, k, n].join('|'))) : `<label class="sp"><input type="checkbox" data-choose="${esc(n)}" ${on ? 'checked' : ''}> Vastaan tähän</label>`;
      return `<details class="simtask" data-n="${esc(n)}" data-chosen="${on ? 1 : 0}"><summary><b>${esc(t.n)}. ${esc(t.title)}</b><span class="chip">${esc(t.points)} p</span>${right}</summary><div class="simbody" data-body></div></details>`;
    };
    signal = setView(masthead(homeCrumb(a), 'Koesimulaatio', title) + `
      <div class="simbar" role="region" aria-label="Kokeen tila">
        ${done ? `<span class="total" id="simTotal">${tot.total} / ${tot.totalMax} p</span><span class="muted"><span id="simAssessed">arvioitu ${tot.assessed} kohdasta</span> · koe palautettu ${fmtDate(sim.submitted)}, aikaa käytetty ${fmt(minutes * 6e4 - remaining())}</span>`
          : `<span class="clock" id="clock" aria-live="off">${fmt(remaining())}</span><span class="muted" id="chosenInfo"></span><span class="sp"></span>
            <button type="button" class="btn" id="simPause">${sim.pauseAt ? 'Jatka' : 'Tauko'}</button><button type="button" class="btn primary" id="simSubmit">Palauta koe</button>`}
        <button type="button" class="btn ghost" id="simReset">${done ? 'Uusi yritys' : 'Keskeytä'}</button>
      </div>
      ${done ? '<p class="muted">Avaa tehtävä, katso malliratkaisu ja arvioi pisteesi. Kokonaispisteet päivittyvät jokaisen arvion jälkeen.</p>'
        : `<p class="warnbox" id="pauseNote" ${sim.pauseAt ? '' : 'hidden'}>Tauko. Kello on pysähtynyt.</p>`}
      ${sections.map((x, si) => `<section class="section">
        <header><h2>${esc(x.title)}</h2><span class="muted">vastaa ${x.answer}/${x.tasks.length}${x.note ? ' · ' + esc(x.note) : ''}</span><span class="chip" data-count="${si}"></span></header>
        ${x.tasks.map(simTask).join('')}
      </section>`).join('')}
      ${footer()}`);
    const updateCounts = () => {
      sections.forEach((x, si) => { const c = x.tasks.filter(n => chosen.has(n)).length; const el = $(`[data-count="${si}"]`, app); el.textContent = `valittu ${c}/${x.answer}`; el.className = 'chip ' + (c === x.answer ? 'ok' : c > x.answer ? 'bad' : ''); });
      const info = $('#chosenInfo'); if (info) info.textContent = `${chosen.size} tehtävää valittu`;
    };
    updateCounts();
    $$('[data-choose]', app).forEach(cb => {
      cb.addEventListener('click', e => e.stopPropagation());
      cb.onchange = () => { cb.checked ? chosen.add(cb.dataset.choose) : chosen.delete(cb.dataset.choose); sim.chosen = Array.from(chosen); persist(); cb.closest('details').dataset.chosen = cb.checked ? 1 : 0; updateCounts(); };
    });
    $$('details.simtask', app).forEach(d => d.addEventListener('toggle', () => {
      if (!d.open || d.dataset.loaded) return; d.dataset.loaded = 1;
      const t = taskOf(a, k, d.dataset.n), { intro, units } = unitsFor(content, t), ctx = ctxFor(a, k, t, ex);
      const body = $('[data-body]', d);
      body.innerHTML = `${t.summary ? `<p class="muted">${esc(t.summary)}</p>` : ''}${ctx.examUrl ? `<p><a href="${esc(ctx.examUrl)}" target="_blank" rel="noopener">Avaa alkuperäinen tehtävä ↗</a></p>` : ''}${intro ? `<div class="md intro">${md(intro)}</div>` : ''}` + units.map(u => unitBlock(ctx, u, { prefix: 'koe|', showHelp: done })).join('');
      mountUnits(body, units);
    }));
    armConfirm($('#simReset'), done ? 'Varmasti? Aloita alusta' : 'Varmasti? Keskeytä koe', async () => {
      delete S.sims[sk]; persist();
      // exam answers live under their own prefix; a new attempt starts from empty answers
      await Promise.all(sections.flatMap(x => x.tasks).map(n => taskOf(a, k, n)).filter(Boolean)
        .flatMap(t => unitsFor(content, t).units.map(u => idb.del('koe|' + ukey(a, k, t.n, u.id)))));
      simView(a, k, g);
    });
    if (done) {
      app.addEventListener('yo:score', () => { const x = totals(); sim.result = x; persist(); $('#simTotal').textContent = `${x.total} / ${x.totalMax} p`; $('#simAssessed').textContent = `arvioitu ${x.assessed} kohdasta`; }, { signal });
      return;
    }
    const unpause = t => { if (sim.pauseAt) { sim.paused += t - sim.pauseAt; sim.pauseAt = null; } };
    const submit = (at = Date.now()) => { sim.submitted = at; unpause(at); persist(); simView(a, k, g); window.scrollTo(0, 0); };
    armConfirm($('#simSubmit'), 'Varmasti? Palauta', () => submit());
    const clock = $('#clock'), pauseBtn = $('#simPause');
    const tick = () => { const r = remaining(); clock.textContent = fmt(r); clock.classList.toggle('low', r < 15 * 6e4); if (r <= 0 && !sim.pauseAt) submit(sim.start + sim.paused + minutes * 6e4); };
    pauseBtn.onclick = () => {
      if (sim.pauseAt) unpause(Date.now()); else sim.pauseAt = Date.now();
      persist(); pauseBtn.textContent = sim.pauseAt ? 'Jatka' : 'Tauko'; $('#pauseNote').hidden = !sim.pauseAt; tick();
    };
    tick();
    const timer = setInterval(tick, 1000);
    signal.addEventListener('abort', () => clearInterval(timer));
  }

  /* ---------- progress over time ---------- */
  const fmtDay = t => { const d = new Date(t); return `${d.getDate()}.${d.getMonth() + 1}.${String(d.getFullYear()).slice(2)}`; };
  // Mastery after each day = latest self-assessment of every unit so far, summed (the same figure the home view shows).
  function masterySeries(events) {
    const latest = new Map(), byDay = new Map();
    let p = 0, max = 0;
    for (const e of events) {
      const old = latest.get(e.k); if (old) { p -= old.p; max -= old.max; }
      latest.set(e.k, e); p += e.p; max += e.max;
      const day = new Date(e.at); day.setHours(0, 0, 0, 0);
      const prev = byDay.get(day.getTime());
      byDay.set(day.getTime(), { at: day.getTime(), pct: max ? p / max : 0, units: latest.size, n: (prev ? prev.n : 0) + 1 });
    }
    return Array.from(byDay.values());
  }
  function chartGeom(pts) {
    const g = { W: 600, H: 170, L: 40, R: 48, T: 14, B: 26 };
    const t0 = pts[0].at, span = Math.max(pts[pts.length - 1].at - t0, 864e5);
    g.x = at => pts.length === 1 ? (g.L + g.W - g.R) / 2 : g.L + (at - t0) / span * (g.W - g.L - g.R);
    g.y = v => g.T + (1 - v) * (g.H - g.T - g.B);
    return g;
  }
  function lineChart(pts) {
    const g = chartGeom(pts), last = pts[pts.length - 1];
    const grid = [0, 0.5, 1].map(v => `<line x1="${g.L}" x2="${g.W - g.R}" y1="${g.y(v)}" y2="${g.y(v)}" class="g"/><text x="${g.L - 6}" y="${g.y(v) + 4}" text-anchor="end" class="ax">${v * 100} %</text>`).join('');
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${g.x(p.at).toFixed(1)},${g.y(p.pct).toFixed(1)}`).join('');
    const dots = pts.length <= 40 ? pts.map(p => `<circle cx="${g.x(p.at).toFixed(1)}" cy="${g.y(p.pct).toFixed(1)}" r="4" class="dot"/>`).join('')
      : `<circle cx="${g.x(last.at).toFixed(1)}" cy="${g.y(last.pct).toFixed(1)}" r="4" class="dot"/>`;
    return `<svg viewBox="0 0 ${g.W} ${g.H}" role="img" aria-label="Arvioitu osaaminen päivittäin, ${fmtDay(pts[0].at)}–${fmtDay(last.at)}">${grid}
      <text x="${g.L}" y="${g.H - 6}" class="ax">${fmtDay(pts[0].at)}</text>${pts.length > 1 ? `<text x="${g.W - g.R}" y="${g.H - 6}" text-anchor="end" class="ax">${fmtDay(last.at)}</text>` : ''}
      <line class="xh" y1="${g.T}" y2="${g.H - g.B}" hidden/><path d="${path}" class="ln"/>${dots}
      <text x="${g.x(last.at) + 8}" y="${g.y(last.pct) + 4}" class="lbl">${Math.round(last.pct * 100)} %</text></svg><div class="tip" hidden></div>`;
  }
  // Crosshair + tooltip on the nearest day (the table under each chart is the non-pointer alternative).
  function bindChart(el, pts) {
    const svg = $('svg', el), tip = $('.tip', el), xh = $('.xh', svg), g = chartGeom(pts);
    const show = e => {
      const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * g.W;
      let best = pts[0]; for (const p of pts) if (Math.abs(g.x(p.at) - vx) < Math.abs(g.x(best.at) - vx)) best = p;
      const px = g.x(best.at);
      xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.removeAttribute('hidden');
      tip.textContent = `${fmtDay(best.at)} · ${Math.round(best.pct * 100)} % · ${best.units} kohtaa arvioitu · ${best.n} arviota tänä päivänä`;
      tip.hidden = false;
      tip.style.left = Math.max(0, Math.min(px / g.W * r.width - tip.offsetWidth / 2, r.width - tip.offsetWidth)) + 'px';
    };
    svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show);
    svg.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('hidden', ''); });
  }
  function progressView() {
    const bySubj = new Map();
    for (const e of S.history) { const a = e.k.split('|')[0]; if (!subj(a) || !e.max) continue; if (!bySubj.has(a)) bySubj.set(a, []); bySubj.get(a).push(e); }
    const charts = [];
    const cards = DATA.filter(s => bySubj.has(s.id)).map(s => {
      const ev = bySubj.get(s.id).sort((x, y) => x.at - y.at), pts = masterySeries(ev), last = pts[pts.length - 1];
      const weekAgo = pts.slice().reverse().find(p => p.at <= addDays(-7));
      const delta = weekAgo ? Math.round((last.pct - weekAgo.pct) * 100) : null;
      const recent = ev.filter(e => e.at >= addDays(-6)).length;
      charts.push({ id: 'ch-' + s.id, pts });
      return `<section class="card" aria-label="${esc(s.name)}">
        <div class="row"><h2>${esc(s.name.split(',')[0])}</h2><span class="sp"></span><a class="small" href="#/${esc(s.id)}">Harjoittele →</a></div>
        <div class="row"><span class="hero">${Math.round(last.pct * 100)} %</span><span class="muted small">arvioitu osaaminen · ${last.units} kohtaa${delta != null ? ` · <span class="delta ${delta >= 0 ? 'up' : 'down'}">${delta >= 0 ? '+' : ''}${delta} %-yks. viikossa</span>` : ''} · ${recent} arviota 7 päivässä</span></div>
        <div class="chart" id="ch-${esc(s.id)}">${lineChart(pts)}</div>
        <details><summary class="small">Näytä taulukkona</summary><table class="ptable"><thead><tr><th>Päivä</th><th>Osaaminen</th><th>Kohtia</th><th>Arvioita</th></tr></thead><tbody>${pts.map(p => `<tr><td>${fmtDay(p.at)}</td><td>${Math.round(p.pct * 100)} %</td><td>${p.units}</td><td>${p.n}</td></tr>`).join('')}</tbody></table></details>
      </section>`;
    });
    const sims = Object.entries(S.sims).filter(([, v]) => v && v.submitted && v.result).sort((x, y) => y[1].submitted - x[1].submitted).map(([key, v]) => {
      const [a, k, g] = key.split('|'), s = subj(a), x = sessionOf(a, k); if (!s || !x) return '';
      const r = v.result, pct = r.totalMax ? Math.round(r.total / r.totalMax * 100) : 0;
      return `<tr><td>${fmtDay(v.submitted)}</td><td><a href="#/koe/${encodeURIComponent(a)}/${encodeURIComponent(k)}${g ? '/' + encodeURIComponent(g) : ''}">${esc(s.name.split(',')[0])} · ${esc(x.label)}${g ? ' · ' + esc(g) : ''}</a></td><td>${Number(r.total)} / ${Number(r.totalMax)} p (${pct} %)<br><span class="muted">${Number(r.assessed)} kohtaa arvioitu</span></td></tr>`;
    }).join('');
    setView(masthead(homeCrumb(S.ui.subject || ''), 'Edistyminen', 'Arvioitu osaaminen = omien arvioidesi pisteet suhteessa maksimiin, jokaisesta kohdasta viimeisin arvio. Käyrä näyttää, miten se on kehittynyt päivä päivältä.') + `
      ${cards.length ? `<div class="grid2">${cards.join('')}</div>` : '<p class="muted">Ei vielä arvioita. Kun teet tehtävän, näytät malliratkaisun ja arvioit pisteesi, edistyminen näkyy tässä.</p>'}
      <section class="card" aria-labelledby="simres-h"><h2 id="simres-h">Koesimulaatiot</h2>
        ${sims ? `<table class="ptable"><thead><tr><th>Palautettu</th><th>Koe</th><th>Arvioidut pisteet</th></tr></thead><tbody>${sims}</tbody></table>` : '<p class="muted">Ei vielä palautettuja koesimulaatioita.</p>'}</section>
      ${footer()}`);
    for (const c of charts) bindChart(document.getElementById(c.id), c.pts);
    window.scrollTo(0, 0);
  }

  /* ---------- router ---------- */
  const decode = x => { try { return decodeURIComponent(x); } catch (e) { return x; } };
  const hashParts = () => location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decode);
  function route() {
    if (math) closeMath();
    const p = hashParts();
    if (p[0] === 't' && p.length >= 4) return taskView(p[1], p[2], p[3], p[4]);
    if (p[0] === 'koe' && p.length >= 3) return simView(p[1], p[2], p[3]);
    if (p[0] === 'edistyminen') return progressView();
    if (p[0] === 'pika' && p.length >= 3 && startPika(p[1], p[2], true, null, true)) return;   // link from YO-tutka
    home(p[0]); window.scrollTo(0, 0);
  }

  buildToolbar();
  const first = hashParts();
  if ((first[0] === 't' || first[0] === 'koe') && first[2]) getContent(first[1], first[2]);   // fetch in parallel with the task list
  loadMeta().then(() => {
    window.addEventListener('hashchange', route);
    route();
    if (S.ui.aidsOpen) setAids(true, true);   // after the first view, so an embedded calculator does not delay it
  }).catch(e => { setView(masthead('', 'Harjoittelu') + `<p class="warnbox">Tehtävien lataus epäonnistui: ${esc(e.message)}. Sivu toimii vain verkko-osoitteesta (ei file://).</p>`); });
})();
</script>
</body>
</html>
