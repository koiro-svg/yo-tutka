    if (!b || rank(me, b) < 0) P.best[G.quiz.id] = { n: me.n, t: me.t, total: G.items.length };
  }
  save();
}

function tick() {
  if (!G || G.over) return;
  const now = performance.now();
  if (G.state === 'count') {
    if (now >= G.startAt) { G.state = 'play'; render(); }
    else if (V.count) V.count.textContent = String(Math.ceil((G.startAt - now) / 1000));
    return;
  }
  if (V.timer) { const left = G.endAt - now; V.timer.textContent = clock(left); V.timer.classList.toggle('low', left < 10000); }
  if (G.state === 'play') {
    for (const [i, p] of G.pending) if (now - p.sent > RETRY_MS) { p.sent = now; send('claim', { seq: G.seq, i, t2: p.at }); }
    if (now - G.lastRepair > REPAIR_MS) { G.lastRepair = now; repair(false); maybeFinish(); }
    if (now >= G.endAt) {
      G.state = 'wait';
      repair(true);
      syncInput();
      if (isHost()) finish(END_GRACE_MS);
    }
  } else if (G.state === 'wait') {
    if (now > G.endAt + HOST_WATCHDOG_MS && isHost()) finish(0);
    if (now > G.endAt + LOCAL_WATCHDOG_MS) applyEnd({ res: tally() });
  }
}

// Broadcasts are not guaranteed: the absolute state goes out again so a lost message heals itself, every few seconds while
// it changes and at IDLE_REPAIR_MS otherwise (every broadcast counts against the Realtime quota once per receiver).
function repair(force) {
  const parallel = G.mode === 'parallel';
  if (parallel ? G.spectator : !isHost()) return;
  const mine = G.found.get(MY_ID), size = parallel ? mine.set.size : G.claims.size, now = performance.now();
  if (!force && size === G.sentSize && now - G.sentAt < IDLE_REPAIR_MS) return;
  G.sentSize = size; G.sentAt = now;
  if (parallel) send('have', { seq: G.seq, l: [...mine.set], t2: mine.t });
  else send('claims', { seq: G.seq, c: claimList() });
}

function startGame() {
  if (!isHost()) return;

  const msg = { seq: Date.now(), quiz: s.quiz, mode: s.mode, mul: s.mul, players: R.players.map(p => ({ id: p.id, name: p.name })), elapsed: -COUNTDOWN_MS };
  send('start', msg);
  sb.rpc('visa_count_play', { q: s.quiz }).then(() => {}, () => {});   // anonymous play count for Suosituimmat
  beginGame(msg);
  // Nothing else repairs a lost start: a guest without G would ignore the whole game.
  for (const wait of [800, 2000]) setTimeout(() => { if (G?.seq === msg.seq && !G.over) send('snap', snapshot()); }, wait);
}

function buildMap() {
  if (!MAP) { loadMap(); return h('p', { class: 'muted', style: 'margin-top:14px', text: t('loadingMap') }); }
  const NS = 'http://www.w3.org/2000/svg';
  const svgEl = (tag, attrs) => { const el = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v); return el; };
  const index = new Map(G.items.map((it, i) => [it.iso, i]));
  // Percentiles keep far-off territories and Russia from zooming a continent out to the whole world.
  const edges = pick => [...index.keys()].map(iso => MAP.shapes[iso].b[pick]).sort((a, b) => a - b);
  const at = (list, share) => list[Math.floor((list.length - 1) * share)];
  const whole = G.items.length > 150;
  let [x0, y0, x1, y1] = whole ? [0, 0, MAP.w, MAP.h] : [0, 1, 2, 3].map(k => at(edges(k), k < 2 ? .06 : .94));
  for (const iso of index.keys()) {   // ... but a target that fell outside (an island state) must stay clickable
    const b = MAP.shapes[iso].b;
    if (b[2] < x0 || b[0] > x1 || b[3] < y0 || b[1] > y1) { x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]); }
  }
  const pad = whole ? 0 : Math.max(x1 - x0, y1 - y0) * .05;
  const box = [x0 - pad, y0 - pad, x1 - x0 + 2 * pad, y1 - y0 + 2 * pad];
  const svg = svgEl('svg', { viewBox: box.map(Math.round).join(' '), role: 'img', 'aria-label': t('fmt').map });
  const radius = Math.max(box[2] / 170, 2);
  for (const [iso, shape] of Object.entries(MAP.shapes)) {
    const i = index.get(iso), g = svgEl('g', { class: i == null ? 'bg' : 't' });
    if (shape.d) g.append(svgEl('path', { d: shape.d }));
    if (shape.c && i != null) g.append(svgEl('circle', { cx: shape.c[0], cy: shape.c[1], r: radius }));
    if (i != null) { G.cells[i] = g; g.addEventListener('click', () => mapClick(i)); }
    svg.append(g);
  }
  return h('div', { class: 'map' }, svg);
}

function buildCells() {

  const sortText = i => (G.items[i].hint ? G.items[i].hint[lang] : G.items[i][lang][0]);
  const sections = [...groups].map(([g, list]) => {

function paintCell(i) {

  if (c.ans) c.ans.textContent = owner || G.over ? G.items[i][P.lang][0] : '';
  c.classList.toggle('on', !!owner);
  c.classList.toggle('pend', pending);
  c.classList.toggle('miss', G.over && !owner);
  c.querySelector('.who')?.remove();
  if (owner) {

    isHost() && h('button', { class: 'kt-btn primary', text: t('rematch'), onclick: startGame }),
    h('button', { class: 'kt-btn', text: t('lobby'), onclick: () => { G = null; render(); } }),
  ].filter(Boolean));
}

// ---- start ----
Promise.all([getJson('/data/visa.json'), new Promise(done => setTimeout(done, TAB_CHECK_MS))]).then(([d]) => {
  tabCheck = false;
  DATA = d;
  for (const q of d.quizzes) QUIZ.set(q.id, q);
  const pack = url => getJson(url).catch(() => getJson(url));
  packsReady = Promise.all((d.packs || []).map(name => pack(`/data/visa/${name}.json`))).then(packs => {
    for (const q of packs.flatMap(x => x.quizzes)) { d.quizzes.push(q); QUIZ.set(q.id, q); }
    if (!R && Object.keys(P.best).length) render();   // best scores can be for pack quizzes
  });
  packsReady.catch(() => {});   // reported by joinRoom
  setInterval(tick, 100);
  addEventListener('hashchange', route);
  addEventListener('keydown', e => { if (V.opts && /^[1-4]$/.test(e.key) && !e.metaKey && !e.ctrlKey) V.opts[Number(e.key) - 1]?.click(); });
  if (parseCode(location.hash)) route(); else render();
}).catch(() => { app.replaceChildren(h('p', { class: 'err', text: t('noData') })); });
})();
</script>
</body>
</html>
